# How to build the package
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Packet informations
[project]
name = "ft_package"
version = "0.0.1"
authors = [
  { name="sylabbe", email="classified@example.com" },
]
description = "This package is an exercise(day1/ex09)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

# Setuptool settings
[tool.setuptools]
packages = ["ft_package"]